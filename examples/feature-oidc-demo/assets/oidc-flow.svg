<circle cx="122" cy="1074" r="32" fill="#A7F3D0"/>
<text x="122" y="1087" font-family="Noto Sans SC, Source Han Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="36" font-weight="800" fill="#111827" text-anchor="middle">4</text>
<text x="180" y="1068" font-family="Noto Sans SC, Source Han Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="32" font-weight="600" fill="#60A5FA" text-anchor="start">你的后端 → 身份服务</text>
<rect x="810.0" y="1034" width="186" height="50" rx="25.0" fill="#111827" stroke="#60A5FA" stroke-width="3"/>
<text x="828" y="1070" font-family="Noto Sans SC, Source Han Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="30" font-weight="600" fill="#60A5FA" text-anchor="start">服务器直连</text>
<text x="180" y="1124" font-family="Noto Sans SC, Source Han Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="38" font-weight="700" fill="#FFFFFF" text-anchor="start">交出 code 和 verifier 原件</text>
<rect x="180" y="1162" width="506" height="56" rx="14" fill="#111827" stroke="#A7F3D0" stroke-width="3"/>
