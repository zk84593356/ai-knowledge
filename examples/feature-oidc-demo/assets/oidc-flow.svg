<path d="M111 462 L122 478 L133 462" fill="none" stroke="#4A5A70" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="60" y="480" width="960" height="232" rx="24" fill="#1F2937" filter="url(#sh)"/>
<circle cx="122" cy="542" r="32" fill="#4A5A70"/>
<text x="122" y="555" font-family="Noto Sans SC, Source Han Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="36" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="180" y="536" font-family="Noto Sans SC, Source Han Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="32" font-weight="600" fill="#B8C2D0" text-anchor="start">身份服务 → 浏览器 → 你的回调</text>
