<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1570" viewBox="0 0 1080 1570"><defs><filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.28"/></filter></defs>
<rect x="0" y="0" width="1080" height="1570" rx="0" fill="#111827"/>
<text x="60" y="110" font-family="Noto Sans SC, Source Han Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="52" font-weight="800" fill="#FFFFFF" text-anchor="start">三个随机值在哪生成、在哪被检查</text>
<text x="60" y="168" font-family="Noto Sans SC, Source Han Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="34" font-weight="400" fill="#B8C2D0" text-anchor="start">原件只存在服务端会话里，经过浏览器的只有副本或摘要</text>
