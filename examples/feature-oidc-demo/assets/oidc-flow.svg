<text x="200" y="935" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="32" font-weight="700" fill="#FCD34D" text-anchor="start">state</text>
<text x="310" y="935" font-family="Noto Sans SC, Source Han Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="32" font-weight="500" fill="#FFFFFF" text-anchor="start">你的代码核对</text>
