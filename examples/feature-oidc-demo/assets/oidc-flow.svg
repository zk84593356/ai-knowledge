<circle cx="122" cy="1340" r="32" fill="#60A5FA"/>
<text x="122" y="1353" font-family="Noto Sans SC, Source Han Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="36" font-weight="800" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="180" y="1334" font-family="Noto Sans SC, Source Han Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="32" font-weight="600" fill="#60A5FA" text-anchor="start">你的后端</text>
<rect x="750.0" y="1300" width="246" height="50" rx="25.0" fill="#60A5FA"/>
<text x="768" y="1336" font-family="Noto Sans SC, Source Han Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="30" font-weight="600" fill="#111827" text-anchor="start">通过才记下用户</text>
<text x="180" y="1390" font-family="Noto Sans SC, Source Han Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="38" font-weight="700" fill="#FFFFFF" text-anchor="start">验证 ID Token 的签名、iss、aud、exp</text>
