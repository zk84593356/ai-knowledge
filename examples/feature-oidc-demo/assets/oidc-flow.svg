<circle cx="122" cy="276" r="32" fill="#4A5A70"/>
<text x="122" y="289" font-family="Noto Sans SC, Source Han Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="36" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="180" y="270" font-family="Noto Sans SC, Source Han Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="32" font-weight="600" fill="#B8C2D0" text-anchor="start">你的后端 → 浏览器 → 身份服务</text>
<rect x="840.0" y="236" width="156" height="50" rx="25.0" fill="#111827" stroke="#B8C2D0" stroke-width="3"/>
<text x="858" y="272" font-family="Noto Sans SC, Source Han Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="30" font-weight="600" fill="#B8C2D0" text-anchor="start">经浏览器</text>
<text x="180" y="326" font-family="Noto Sans SC, Source Han Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="38" font-weight="700" fill="#FFFFFF" text-anchor="start">生成三个随机值，原件存进会话，再跳转</text>
<rect x="180" y="364" width="216" height="56" rx="14" fill="#111827" stroke="#FCD34D" stroke-width="3"/>
<text x="200" y="403" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="32" font-weight="700" fill="#FCD34D" text-anchor="start">state</text>
<text x="310" y="403" font-family="Noto Sans SC, Source Han Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="32" font-weight="500" fill="#FFFFFF" text-anchor="start">副本</text>
<rect x="412" y="364" width="216" height="56" rx="14" fill="#111827" stroke="#60A5FA" stroke-width="3"/>
<text x="432" y="403" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="32" font-weight="700" fill="#60A5FA" text-anchor="start">nonce</text>
<text x="542" y="403" font-family="Noto Sans SC, Source Han Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="32" font-weight="500" fill="#FFFFFF" text-anchor="start">副本</text>
