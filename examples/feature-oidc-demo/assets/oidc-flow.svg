<text x="368" y="1201" font-family="Noto Sans SC, Source Han Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="32" font-weight="500" fill="#FFFFFF" text-anchor="start">身份服务核对摘要</text>
<path d="M632 1191.0 L641.88 1200.88 L658 1181.12" fill="none" stroke="#A7F3D0" stroke-width="4.16" stroke-linecap="round" stroke-linejoin="round"/>
