<text x="122" y="821" font-family="Noto Sans SC, Source Han Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="36" font-weight="800" fill="#111827" text-anchor="middle">3</text>
<text x="180" y="802" font-family="Noto Sans SC, Source Han Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="32" font-weight="600" fill="#FCD34D" text-anchor="start">你的回调</text>
<text x="180" y="858" font-family="Noto Sans SC, Source Han Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="38" font-weight="700" fill="#FFFFFF" text-anchor="start">先核对 state，再兑换 code</text>
