<text x="496" y="669" font-family="Cascadia Code, Consolas, Menlo, monospace" font-size="32" font-weight="700" fill="#B8C2D0" text-anchor="start">code</text>
<text x="587" y="669" font-family="Noto Sans SC, Source Han Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="32" font-weight="500" fill="#FFFFFF" text-anchor="start">一次性</text>
